name: Sync upstream

# Keeps this fork tracking upstream, on two separate rails:
#
#   main - a plain mirror of upstream's `main` branch, updated every day. Nothing
#          of ours is ever committed to it. Its only job is to be an accurate base
#          to cut branches from, so pull requests we send upstream contain our
#          commits and nothing else.
#
#   dev  - our own line: upstream releases plus our patches, and what BRAT installs.
#          It is only ever merged with a *tagged upstream release*, never with
#          upstream's main tip, so we do not ship unreleased upstream work.
#
# Merging a release into `dev` pushes it and calls publish.yml, which cuts the
# BRAT release. Merge conflicts are parked in a pull request rather than failing
# the run, so a known-and-tracked conflict does not email every morning. Build and
# test failures DO fail the run, and stop `dev` moving: those mean a patch of ours
# stopped applying cleanly to the new upstream code.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM: obsidian-tasks-group/obsidian-tasks

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Configure git and fetch upstream
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch upstream --tags --force
          git fetch origin --tags --force

      # Forced, because `main` is a mirror we never commit to, so whatever upstream
      # says is right by definition. A non-forced push here fails permanently the
      # moment the two diverge for any reason - including someone syncing `main` by
      # hand to get an up-to-date base for an upstream pull request.
      - name: Mirror main from upstream
        run: |
          git push --force origin refs/remotes/upstream/main:refs/heads/main
          echo "::notice::main now mirrors upstream/main ($(git rev-parse --short upstream/main))."

      - name: Look for a new upstream release
        id: upstream
        run: |
          tag=$(gh release view --repo "$UPSTREAM" --json tagName -q .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "refs/tags/$tag^{commit}" HEAD; then
            echo "::notice::dev already contains upstream release $tag."
            echo 'new=false' >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Upstream release $tag is not in dev yet."
            echo 'new=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Merge the release into dev
        id: merge
        if: steps.upstream.outputs.new == 'true'
        run: |
          if git merge --no-edit "refs/tags/${{ steps.upstream.outputs.tag }}"; then
            echo 'merged=true' >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo 'merged=false' >> "$GITHUB_OUTPUT"
          fi

      # Deliberately exits 0: a conflict we already know about should not send a
      # failure email every day. The open pull request is the persistent reminder.
      #
      # The branch is cut at the release tag rather than pointing at `main`, which
      # now tracks upstream's main tip and would drag in unreleased work.
      - name: Park conflicts in a pull request
        if: steps.merge.outputs.merged == 'false'
        run: |
          tag='${{ steps.upstream.outputs.tag }}'
          branch="sync/$tag"
          git push --force origin "refs/tags/$tag^{commit}:refs/heads/$branch"

          pr=$(gh pr list --base dev --head "$branch" --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then
            body=$(printf '%s\n\n%s\n%s\n%s\n\n%s\n' \
              "Merging upstream release \`$tag\` into dev hit conflicts. Resolve locally:" \
              '```' \
              "git fetch origin && git checkout dev && git merge $branch" \
              '```' \
              'Releases stay paused until this lands.')
            gh pr create --base dev --head "$branch" \
              --title "Sync upstream $tag into dev" --body "$body"
            echo "::warning::Upstream $tag conflicts with dev - opened a sync PR."
          else
            created=$(gh pr view "$pr" --json createdAt -q .createdAt)
            age=$(( ( $(date +%s) - $(date -d "$created" +%s) ) / 86400 ))
            echo "::notice::Upstream $tag still conflicts; PR #$pr has been open $age day(s)."
            if [ "$age" -gt 0 ] && [ $((age % 7)) -eq 0 ]; then
              gh pr comment "$pr" --body "Still conflicting after $age days; releases are paused."
            fi
          fi

      - uses: actions/setup-node@v4
        if: steps.merge.outputs.merged == 'true'
        with:
          node-version: 22
          cache: yarn

      # Runs before `dev` is pushed, so a merge that breaks our patches never lands.
      - name: Build and verify the merge
        if: steps.merge.outputs.merged == 'true'
        run: |
          yarn install --frozen-lockfile
          yarn test
          yarn run build

      - name: Push dev
        if: steps.merge.outputs.merged == 'true'
        run: git push origin HEAD:dev

  # Called explicitly: the push above uses GITHUB_TOKEN, which by design does not
  # start a new workflow run, so publish.yml's own push trigger will not fire.
  publish:
    needs: sync
    if: needs.sync.outputs.merged == 'true'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
    secrets: inherit
